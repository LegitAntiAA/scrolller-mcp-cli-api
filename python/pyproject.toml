[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scrolller-py"
version = "0.1.0"
description = "Python API client for Scrolller (scrolller.com) — media discovery, feeds, search, comments, likes, collections"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "scrolller-mcp-cli-api contributors" }]
keywords = ["scrolller", "api", "client", "downloader", "media"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "httpx[socks]>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
]

[project.urls]
Repository = "https://github.com/TODO-owner/scrolller-mcp-cli-api"

[tool.hatch.build.targets.wheel]
packages = ["src/scrolller"]
